<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="サイフ">
<meta name="theme-color" content="#12261F">
<link rel="apple-touch-icon" href="icon.png">
<title>サイフメーター</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@500;700;900&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: one narrow column. Deep-green "vault" card (total saved + coin stack + goal bar) on top, entry card below, history last.
   Calm palette: deep green + muted gold. Motion is limited to one coin settling onto the stack. */
:root{
  --bg:#F4EFE4; --surface:#FFFFFF; --sunk:#ECE6D6; --line:#DDD5C0;
  --ink:#1B241F; --muted:#6B7068;
  --hero:#12261F; --hero2:#1B382D; --hero-fg:#F6F1E4; --hero-muted:#9FB3A8; --hero-track:#2A4A3E;
  --gold:#E2B94F; --gold-hi:#F0D27C; --gold-deep:#B8902F; --gold-ink:#2A2008; --pos:#9A7418;
  --c1:#5E8C6A; --c2:#C58B4E; --c3:#6F8FB3; --c4:#9A7BB0; --c5:#C4768A; --c6:#5BA3A8; --c7:#A2A04C; --c8:#BE7157; --c9:#8A918B;
  --f-disp:"Unbounded","Zen Kaku Gothic New",system-ui,sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B1210; --surface:#13201B; --sunk:#1B2B25; --line:#233630;
  --ink:#EDEBE0; --muted:#98A59D; --hero:#16302A; --hero2:#1E4035; --pos:#E2B94F;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1210; --surface:#13201B; --sunk:#1B2B25; --line:#233630;
  --ink:#EDEBE0; --muted:#98A59D; --hero:#16302A; --hero2:#1E4035; --pos:#E2B94F;
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px calc(env(safe-area-inset-bottom,0px) + 48px);margin:0}
button,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--gold-deep);outline-offset:2px}
.wrap{width:100%;max-width:540px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.wrap>*{min-width:0}

/* ---------- vault card ---------- */
.hero{background:linear-gradient(160deg,var(--hero2),var(--hero) 70%);color:var(--hero-fg);border-radius:22px;padding:16px 18px;display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-70px;top:-70px;width:200px;height:200px;border-radius:50%;background:var(--gold);opacity:.09;filter:blur(14px);pointer-events:none}
.hero>*{position:relative;z-index:1}
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.label{font-size:12px;font-weight:700;color:var(--hero-muted);letter-spacing:.08em}
.chip-state{font-size:12px;font-weight:900;padding:3px 10px;border-radius:999px;background:var(--gold);color:var(--gold-ink);white-space:nowrap}
.hero-main{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.hero-l{min-width:0;display:flex;flex-direction:column;gap:6px;padding-bottom:6px}
.spent{font-family:var(--f-disp);font-weight:800;font-size:clamp(36px,11.5vw,54px);line-height:1;letter-spacing:-.04em;display:flex;align-items:baseline;gap:4px;font-variant-numeric:tabular-nums;color:var(--gold-hi)}
.spent small{font-size:.42em;font-weight:500;color:var(--hero-muted)}
.spent b{font-weight:800}
.spent.bump{animation:bump .6s ease-out}
@keyframes bump{40%{transform:scale(1.035)}}
.msg{font-size:14px;font-weight:700;min-height:1.5em}
.msg em{font-style:normal;color:var(--gold-hi)}
.stack{flex:none;width:84px;height:132px;overflow:visible}
.coin.drop{animation:drop .55s cubic-bezier(.3,1.2,.5,1)}
@keyframes drop{0%{transform:translateY(-46px);opacity:0}60%{opacity:1}100%{transform:none}}

.goalbar{margin-top:14px}
.track{position:relative;height:12px;border-radius:6px;background:var(--hero-track)}
.fill{position:absolute;inset:0 auto 0 0;border-radius:inherit;background:linear-gradient(90deg,var(--gold-deep),var(--gold));transition:width .9s cubic-bezier(.2,1,.4,1)}
.tick{position:absolute;top:-5px;bottom:-5px;width:3px;margin-left:-1.5px;background:var(--hero-fg);border-radius:2px}
.tick span{position:absolute;bottom:calc(100% + 2px);right:0;font-size:10px;font-weight:600;white-space:nowrap;font-family:var(--f-num);color:var(--hero-fg)}
.tick.left span{right:auto;left:0}
.foot{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--hero-muted)}
.foot b{color:var(--hero-fg);font-family:var(--f-num);font-weight:600}
.linkbtn{border:0;background:none;color:var(--gold-hi);font-weight:700;font-size:12px;padding:2px 0;text-decoration:underline;text-underline-offset:3px}
.budget-edit{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.budget-edit input{flex:1 1 120px;min-width:0;border:1.5px solid var(--hero-track);background:transparent;color:var(--hero-fg);border-radius:10px;padding:8px 10px;font-family:var(--f-num);font-size:16px}
.btn-s{border:0;border-radius:10px;padding:8px 14px;font-weight:900;font-size:13px;background:var(--hero-track);color:var(--hero-fg)}
.btn-s.pri{background:var(--gold);color:var(--gold-ink)}

/* ---------- entry ---------- */
.entry{background:var(--surface);border-radius:22px;padding:14px;display:flex;flex-direction:column;gap:11px;box-shadow:0 1px 0 var(--line),0 10px 30px -18px rgba(18,38,31,.35)}
.amt{display:flex;align-items:center;gap:6px;background:var(--sunk);border-radius:14px;padding:6px 14px;transition:transform .2s}
.amt span{font-family:var(--f-disp);font-size:22px;font-weight:700;color:var(--muted)}
.amt input{flex:1 1 0;width:0;min-width:0;border:0;background:transparent;font-family:var(--f-disp);font-size:30px;font-weight:700;padding:4px 0;outline:none;letter-spacing:-.02em}
.amt input::placeholder{color:var(--muted);opacity:.45;font-family:var(--f-body);font-size:20px;font-weight:700;letter-spacing:0}
.amt:focus-within{box-shadow:inset 0 0 0 2px var(--gold-deep)}
.amt.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.cats{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-inline:-14px;padding:2px 14px}
.cats::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;border:0;background:var(--sunk);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:700;white-space:nowrap;transition:background .2s,color .2s}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--dot)}
.chip[aria-pressed="true"]{background:var(--hero);color:var(--hero-fg)}
.chip:active{opacity:.7}
.memo{width:100%;min-width:0;border:0;background:var(--sunk);border-radius:12px;padding:10px 14px;font-weight:500;font-size:16px}
.memo:focus{outline:none;box-shadow:inset 0 0 0 2px var(--gold-deep)}
.actions{display:flex;gap:8px}
.save{flex:1 1 0;min-width:0;border:0;border-radius:14px;background:var(--gold);color:var(--gold-ink);font-family:var(--f-body);font-weight:900;font-size:17px;min-height:52px;letter-spacing:.12em;box-shadow:0 4px 0 #A98221;transition:transform .12s,box-shadow .12s,opacity .2s}
.save:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 #A98221}
.save:disabled{opacity:.35;cursor:not-allowed;box-shadow:none}
.status{font-size:13px;font-weight:700;color:var(--muted);min-height:1.3em;margin-top:-3px}
.status.err{color:#D1495B}

/* ---------- history ---------- */
.hist{display:flex;flex-direction:column}
.hist-h{display:flex;justify-content:space-between;align-items:baseline;padding:10px 2px 4px}
.hist-h h2{font-family:var(--f-disp);font-size:15px;font-weight:700;margin:0;letter-spacing:.02em}
.hist-h span{font-size:12px;color:var(--muted);font-family:var(--f-num)}
.dayhead{font-size:12px;color:var(--muted);font-weight:700;padding:14px 2px 4px;display:flex;justify-content:space-between}
.dayhead span:last-child{font-family:var(--f-num)}
.day{background:var(--surface);border-radius:16px;padding:2px 14px}
.item{display:grid;grid-template-columns:30px minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .dot{width:30px;height:30px;border-radius:10px;background:color-mix(in srgb,var(--dot) 20%,transparent);display:grid;place-items:center}
.item .dot i{width:10px;height:10px;border-radius:50%;background:var(--dot)}
.item .w div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.item .w small{color:var(--muted);font-size:12px}
.item .y{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-weight:600;color:var(--pos)}
.item.new{animation:slidein .6s ease-out}
@keyframes slidein{0%{opacity:0;transform:translateY(-8px);background:color-mix(in srgb,var(--gold) 22%,transparent)}100%{opacity:1;transform:none}}
.del{border:0;background:none;color:var(--muted);padding:4px 6px;border-radius:6px;font-size:12px;font-weight:700}
.del:hover{color:#D1495B;background:var(--sunk)}
.del.confirm{color:#fff;background:#D1495B}
.empty{color:var(--muted);font-size:14px;padding:20px;border:2px dashed var(--line);border-radius:16px;text-align:center;margin-top:6px}

/* ---------- toast ---------- */
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 18px);transform:translate(-50%,-140%);z-index:60;background:var(--hero);color:var(--gold-hi);border:1px solid rgba(226,185,79,.35);font-weight:900;font-size:15px;padding:10px 18px;border-radius:999px;box-shadow:0 10px 30px -8px rgba(0,0,0,.4);white-space:nowrap;visibility:hidden;transition:transform .45s cubic-bezier(.3,1.4,.5,1),visibility 0s .45s}
.toast.show{transform:translate(-50%,0);visibility:visible;transition:transform .45s cubic-bezier(.3,1.4,.5,1)}
@media (prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <section class="hero" id="hero">
    <div class="hero-top">
      <span class="label" id="mlabel">我慢して貯めた金額</span>
      <span class="chip-state" id="state">まだ0円</span>
    </div>
    <div class="hero-main">
      <div class="hero-l">
        <div class="spent" id="spent"><small>¥</small><b id="spentNum">0</b></div>
        <div class="msg" id="msg"></div>
      </div>
      <svg class="stack" id="stack" viewBox="0 0 84 132" aria-hidden="true"></svg>
    </div>
    <div class="goalbar" aria-hidden="true">
      <div class="track"><div class="fill" id="fill"></div><div class="tick" id="tick"><span id="tickLabel"></span></div></div>
    </div>
    <div class="foot">
      <span id="foot"></span>
      <button type="button" class="linkbtn" id="budgetBtn">目標を設定</button>
    </div>
    <div class="budget-edit" id="budgetEdit" hidden>
      <input id="budgetIn" inputmode="numeric" aria-label="貯金の目標(円)" placeholder="100000">
      <button type="button" class="btn-s pri" id="budgetSave">保存</button>
      <button type="button" class="btn-s" id="budgetCancel">やめる</button>
    </div>
  </section>

  <form class="entry" id="form" autocomplete="off">
    <div class="amt" id="amtBox"><span>¥</span><input id="amount" inputmode="numeric" placeholder="いくら我慢した？" aria-label="金額" autofocus></div>
    <div class="cats" id="cats" role="group" aria-label="カテゴリ"></div>
    <input class="memo" id="memo" placeholder="何を我慢した？(任意)" maxlength="40" aria-label="メモ">
    <div class="actions">
      <button class="save" id="save" type="submit" disabled>貯める</button>
    </div>
    <div class="status" id="status" role="status"></div>
  </form>

  <section class="hist">
    <div class="hist-h"><h2>貯金の履歴</h2><span id="count"></span></div>
    <div id="list"></div>
  </section>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
const CATS=[
  {id:"food",name:"食費",c:"--c1"},{id:"cafe",name:"カフェ・外食",c:"--c2"},{id:"daily",name:"日用品",c:"--c3"},
  {id:"fashion",name:"服・美容",c:"--c5"},{id:"fun",name:"娯楽・趣味",c:"--c4"},{id:"social",name:"交際費",c:"--c8"},
  {id:"move",name:"交通",c:"--c6"},{id:"sub",name:"サブスク",c:"--c7"},{id:"other",name:"その他",c:"--c9"}];
const catOf=id=>CATS.find(c=>c.id===id)||CATS[CATS.length-1];
const $=id=>document.getElementById(id);
const yen=n=>"¥"+Math.round(n).toLocaleString("ja-JP");
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const esc=s=>String(s??"").replace(/[&<>"]/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]));
const sum=a=>a.reduce((s,i)=>s+i.amount,0);
const reduced=matchMedia("(prefers-reduced-motion: reduce)").matches;

// goal=貯金の目標額, prior=先月までに貯めた分(今月の記録は items から足す)
let items=[],goal=80000,prior=0,sel={cat:"food"},store=null,shownTotal=0,newId=null,dropNext=false,lastN=-1;

/* ---------- entry ---------- */
$("cats").innerHTML=CATS.map(c=>`<button type="button" class="chip" data-id="${c.id}" style="--dot:var(${c.c})" aria-pressed="${c.id===sel.cat}"><i></i>${c.name}</button>`).join("");
$("cats").addEventListener("click",e=>{const b=e.target.closest(".chip");if(b)setCat(b.dataset.id)});
function setCat(id){sel.cat=id;document.querySelectorAll(".chip").forEach(b=>b.setAttribute("aria-pressed",b.dataset.id===id))}
const amountIn=$("amount");
amountIn.addEventListener("input",()=>{
  const digits=amountIn.value.replace(/[^0-9]/g,"").replace(/^0+/,"").slice(0,9);
  amountIn.value=digits?Number(digits).toLocaleString("ja-JP"):"";
  $("save").disabled=!digits;
});
const amountVal=()=>Number(amountIn.value.replace(/[^0-9]/g,""))||0;
function status(msg,cls=""){const s=$("status");s.textContent=msg;s.className="status "+cls}

$("form").addEventListener("submit",async e=>{
  e.preventDefault();
  const amount=amountVal();
  if(!amount){$("amtBox").classList.remove("shake");void $("amtBox").offsetWidth;$("amtBox").classList.add("shake");return}
  if(!store){status("準備中です。少し待ってからもう一度押してください。","err");return}
  const rec={kind:"e",amount,cat:sel.cat,memo:$("memo").value.trim(),date:ymd(new Date()),want:false,createdAt:Date.now()};
  $("save").disabled=true;
  try{
    dropNext=!reduced;
    const ref=await store.add(rec);
    newId=ref&&ref.id||rec.id;
    toast(PRAISE[Math.floor(Math.random()*PRAISE.length)]+"  +"+yen(rec.amount));
    status("");
    amountIn.value="";$("memo").value="";
    amountIn.focus({preventScroll:true});
  }catch(err){dropNext=false;status("保存できませんでした。通信状態を確認してもう一度お試しください。","err");$("save").disabled=false}
});

/* ---------- feedback ---------- */
const PRAISE=["ナイス我慢","ちゃんと貯まってる","その我慢、財布に残った","コツコツが一番強い","1コインずつ、確実に"];
function toast(text){const t=$("toast");t.textContent=text;t.classList.remove("show");void t.offsetWidth;t.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("show"),1800)}
function countTo(n){
  const el=$("spentNum"),start=shownTotal,t0=performance.now(),dur=reduced?0:750;
  shownTotal=n;
  if(!dur||start===n){el.textContent=Math.round(n).toLocaleString("ja-JP");return}
  const sp=$("spent");sp.classList.remove("bump");void sp.offsetWidth;sp.classList.add("bump");
  (function step(t){const k=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-k,3);el.textContent=Math.round(start+(n-start)*e).toLocaleString("ja-JP");if(k<1)requestAnimationFrame(step)})(t0);
}
// コインの山。貯まるほど高くなり、新しく貯めたときは一番上の1枚だけが落ちてくる
function drawStack(n,animate){
  let h="";
  if(n===0)h=`<ellipse cx="42" cy="118" rx="34" ry="9" fill="none" stroke="#9FB3A8" stroke-opacity=".5" stroke-dasharray="4 4"/>`;
  for(let i=0;i<n;i++){
    const y=118-i*6,top=i===n-1,band=i%2?"#C99C3A":"#D9B25A";
    h+=`<g class="coin${top&&animate?" drop":""}"><ellipse cx="42" cy="${y+4}" rx="34" ry="9" fill="${band}"/><rect x="8" y="${y}" width="68" height="4" fill="${band}"/><ellipse cx="42" cy="${y}" rx="34" ry="9" fill="${top?"#F0D27C":band}" stroke="#8F6C1E" stroke-opacity=".35"/>${top?`<ellipse cx="42" cy="${y}" rx="24" ry="5.5" fill="none" stroke="#B8902F" stroke-opacity=".5"/>`:""}</g>`;
  }
  $("stack").innerHTML=h;
}

/* ---------- budget(=貯金の目標) ---------- */
$("budgetBtn").onclick=()=>{$("budgetEdit").hidden=false;$("budgetIn").value=goal;$("budgetIn").focus()};
$("budgetCancel").onclick=()=>{$("budgetEdit").hidden=true};
$("budgetSave").onclick=async()=>{
  const v=Number(String($("budgetIn").value).replace(/[^0-9]/g,""));
  if(!v){$("budgetIn").focus();return}
  goal=v;$("budgetEdit").hidden=true;render();
  try{await store.setBudget(v)}catch(e){status("目標を保存できませんでした","err")}
};

/* ---------- stage ---------- */
function stageOf(total,goal){
  const r=total/goal;
  if(total<=0)return{chip:"まだ0円",msg:"最初の我慢を記録しよう"};
  if(r>=1)return{chip:"目標達成",msg:`目標を <em>${yen(total-goal)}</em> 上回っています`};
  const left=`目標まであと <em>${yen(goal-total)}</em>`;
  if(r>=.75)return{chip:"あと少し",msg:left};
  if(r>=.5)return{chip:"半分超え",msg:left};
  if(r>=.25)return{chip:"コツコツ",msg:left};
  return{chip:"貯め始め",msg:left};
}

/* ---------- render ---------- */
function render(){
  const now=new Date(),key=now.getFullYear()+"-"+pad(now.getMonth()+1),todayStr=ymd(now);
  const mon=items.filter(i=>i.date&&i.date.startsWith(key));
  const monthSum=sum(mon),todaySum=sum(mon.filter(i=>i.date===todayStr));
  const total=prior+monthSum;
  const p=stageOf(total,goal);

  countTo(total);
  $("state").textContent=p.chip;$("msg").innerHTML=p.msg;
  const n=total>0?Math.max(1,Math.min(18,Math.ceil(Math.min(1,total/goal)*18))):0;
  if(n!==lastN||dropNext){drawStack(n,dropNext);lastN=n;dropNext=false}

  const scale=Math.max(goal,total),tickPos=goal/scale*100;
  $("fill").style.width=(total/scale*100)+"%";
  $("tick").style.left=tickPos+"%";$("tick").classList.toggle("left",tickPos<25);
  $("tickLabel").textContent="目標 "+yen(goal);
  $("foot").innerHTML=`${now.getMonth()+1}月 <b>+${yen(monthSum)}</b> ・ 今日 <b>+${yen(todaySum)}</b>`;

  const sorted=[...mon].sort((a,b)=>b.date.localeCompare(a.date)||b.createdAt-a.createdAt);
  $("count").textContent=sorted.length?`${now.getMonth()+1}月 ${sorted.length}件`:"";
  if(!sorted.length){$("list").innerHTML=`<div class="empty">今月の記録はまだありません。<br>我慢したことと金額を入れて「貯める」を押すと、ここに並びます。</div>`;return}
  const wd="日月火水木金土";let html="",i=0;
  while(i<sorted.length){
    const cur=sorted[i].date,group=[];while(i<sorted.length&&sorted[i].date===cur)group.push(sorted[i++]);
    const d=new Date(cur+"T00:00");
    html+=`<div class="dayhead"><span>${d.getMonth()+1}/${d.getDate()} (${wd[d.getDay()]})${cur===todayStr?" 今日":""}</span><span>+${yen(sum(group))}</span></div><div class="day">`;
    for(const it of group){const c=catOf(it.cat);
      html+=`<div class="item${it.id===newId?" new":""}" style="--dot:var(${c.c})"><span class="dot"><i></i></span><div class="w"><div>${esc(it.memo||c.name)}</div>${it.memo?`<small>${c.name}</small>`:""}</div><div class="y">+${yen(it.amount)}</div><button class="del" data-id="${esc(it.id)}" aria-label="削除">削除</button></div>`}
    html+="</div>";
  }
  $("list").innerHTML=html;newId=null;
}
$("list").addEventListener("click",async e=>{
  const b=e.target.closest(".del");if(!b)return;
  if(!b.classList.contains("confirm")){document.querySelectorAll(".del.confirm").forEach(x=>{x.classList.remove("confirm");x.textContent="削除"});b.classList.add("confirm");b.textContent="本当に削除";return}
  try{await store.remove(b.dataset.id)}catch(err){status("削除できませんでした","err")}
});

/* ---------- storage (Google Apps Script) ---------- */
// 記録先(Apps Script ウェブアプリのURL、/exec まで)
const API="https://script.google.com/macros/s/AKfycbx1MsVpcmQdXEa--Pd07HwtpItNpQNcVwCaKjNZwBdXGToXYljO1T2RqCa3grynIY39kg/exec";
// 合言葉はURLの ?k=… から取り、次回以降のために端末に覚えておく
const TOKEN=(()=>{
  const q=new URLSearchParams(location.search).get("k");
  try{if(q)localStorage.setItem("saifu-k",q);return q||localStorage.getItem("saifu-k")||""}catch(e){return q||""}
})();
// text/plain で送ると、ブラウザの事前確認(CORS)なしで Apps Script に届く
async function call(fn,...args){
  const r=await fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({fn,k:TOKEN,args})});
  const j=await r.json();
  if(!j.ok)throw new Error(j.error||"通信エラー");
  return j.result;
}
const monthKey=()=>{const d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)};
let loadedMonth=null;
async function load(){
  const key=monthKey();
  try{
    const r=await call("apiLoad",key);
    items=r.items;goal=r.budget;loadedMonth=key;
    // 累計から今月分を引いて「先月まで」を求める(今月分は画面側で足し直す)
    prior=typeof r.totalAll==="number"?Math.max(0,r.totalAll-sum(items)):0;
    render();
  }catch(err){status("読み込めませんでした。電波を確認してページを開き直してください。","err")}
}
store={
  // 画面には先に反映して演出を出し、保存はうしろで行う
  async add(r){
    const tmp="tmp"+Date.now();r.id=tmp;items.push(r);newId=tmp;render();
    call("apiAdd",r).then(res=>{r.id=res.id}).catch(err=>{
      items=items.filter(i=>i!==r);render();
      status("保存できませんでした。もう一度記録してください。","err");
    });
    return{id:tmp};
  },
  async remove(id){
    if(String(id).startsWith("tmp")){status("保存中です。少し待ってから削除してください。","err");return}
    const prev=items;items=items.filter(i=>i.id!==id);render();
    try{await call("apiDelete",id)}catch(err){items=prev;render();throw err}
  },
  async setBudget(v){await call("apiSetBudget",v)}
};
// 月が変わったり、アプリに戻ってきたら最新を読み直す
document.addEventListener("visibilitychange",()=>{if(!document.hidden)load()});
setInterval(()=>{if(monthKey()!==loadedMonth)load()},60000);
render();
if(TOKEN)load();else status("URLの末尾に ?k=合言葉 を付けて開いてください。","err");
</script>
