<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="サイフ">
<meta name="theme-color" content="#14151F">
<link rel="apple-touch-icon" href="icon.png">
<title>サイフメーター</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@500;700;900&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: one narrow column. Ink "meter card" (spend + budget bar + month-progress bar) on top, pop entry card below, history last. Card + entry fit one phone screen. */
:root{
  --bg:#F3F4F8; --surface:#FFFFFF; --sunk:#E9EBF1; --line:#DCDFE8;
  --ink:#14151F; --muted:#666B7A;
  --hero:#14151F; --hero-fg:#FFFFFF; --hero-muted:#9EA3B5; --hero-track:#2C2E3D;
  --pop:#FFD23F; --pop-ink:#14151F;
  --ok:#2DD881; --warn:#FF9F1C; --bad:#FF4D6D; --day:#8FA8FF;
  --c1:#3D6BFF; --c2:#FF8A1E; --c3:#18B26B; --c4:#9B5CFF; --c5:#FF4D9A; --c6:#12A8C4; --c7:#8AA61A; --c8:#E2602D; --c9:#7B8191;
  --f-disp:"Unbounded","Zen Kaku Gothic New",system-ui,sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D0E14; --surface:#171923; --sunk:#222533; --line:#2A2D3C;
  --ink:#ECEEF5; --muted:#9A9FB0;
  --hero:#1C1F2C; --hero-fg:#FFFFFF; --hero-muted:#9EA3B5; --hero-track:#2E3244;
  --pop:#FFD23F; --pop-ink:#14151F;
  --ok:#3BE391; --warn:#FFAE3D; --bad:#FF5C7A; --day:#9BB2FF;
  --c1:#6D8DFF; --c2:#FFA048; --c3:#3BD18A; --c4:#B48AFF; --c5:#FF73B0; --c6:#3FC6DE; --c7:#B4CF45; --c8:#FF8457; --c9:#9CA1B0;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D0E14; --surface:#171923; --sunk:#222533; --line:#2A2D3C;
  --ink:#ECEEF5; --muted:#9A9FB0;
  --hero:#1C1F2C; --hero-fg:#FFFFFF; --hero-muted:#9EA3B5; --hero-track:#2E3244;
  --pop:#FFD23F; --pop-ink:#14151F;
  --ok:#3BE391; --warn:#FFAE3D; --bad:#FF5C7A; --day:#9BB2FF;
  --c1:#6D8DFF; --c2:#FFA048; --c3:#3BD18A; --c4:#B48AFF; --c5:#FF73B0; --c6:#3FC6DE; --c7:#B4CF45; --c8:#FF8457; --c9:#9CA1B0;
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px calc(env(safe-area-inset-bottom,0px) + 48px);margin:0}
button,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--pop);outline-offset:2px}
.wrap{width:100%;max-width:540px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.wrap>*{min-width:0}

/* ---------- meter card ---------- */
.hero{background:var(--hero);color:var(--hero-fg);border-radius:22px;padding:16px 18px 16px;display:flex;flex-direction:column;gap:10px;--state:var(--ok);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:180px;height:180px;border-radius:50%;background:var(--state);opacity:.14;filter:blur(10px);transition:background .5s}
.hero>*{position:relative;z-index:1}
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.label{font-size:12px;font-weight:700;color:var(--hero-muted);letter-spacing:.08em}
.chip-state{font-size:12px;font-weight:900;padding:3px 10px;border-radius:999px;background:var(--state);color:#14151F;white-space:nowrap;transition:background .4s}
.hero[data-level="3"] .chip-state{animation:throb 1.2s ease-in-out infinite}
@keyframes throb{50%{transform:scale(1.07)}}
.spent{font-family:var(--f-disp);font-weight:800;font-size:clamp(44px,14vw,66px);line-height:1;letter-spacing:-.04em;display:flex;align-items:baseline;gap:4px;font-variant-numeric:tabular-nums}
.spent small{font-size:.42em;font-weight:500;color:var(--hero-muted)}
.spent.bump{animation:bump .55s cubic-bezier(.3,1.6,.5,1)}
@keyframes bump{0%{transform:scale(1)}35%{transform:scale(1.12) rotate(-1.5deg)}100%{transform:scale(1)}}
.hero[data-level="4"] .spent b{color:var(--bad)}
.spent b{font-weight:800;transition:color .3s}
.msg{font-size:14px;font-weight:700;min-height:1.5em}
.msg em{font-style:normal;color:var(--state)}

.bars{display:grid;grid-template-columns:38px minmax(0,1fr);gap:7px 10px;align-items:center;margin-top:2px}
.bars .k{font-size:11px;font-weight:700;color:var(--hero-muted)}
.track{position:relative;height:12px;border-radius:6px;background:var(--hero-track)}
.track.thin{height:7px}
.fill{position:absolute;inset:0 auto 0 0;border-radius:inherit;background:var(--state);transition:width .8s cubic-bezier(.2,1.3,.4,1),background .4s}
.fill.day{background:var(--day)}
.tick{position:absolute;top:-5px;bottom:-5px;width:3px;margin-left:-1.5px;background:var(--hero-fg);border-radius:2px}
.tick span{position:absolute;bottom:calc(100% + 2px);right:0;font-size:10px;font-weight:600;white-space:nowrap;font-family:var(--f-num);color:var(--hero-fg)}
.tick.left span{right:auto;left:0}
.foot{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--hero-muted)}
.foot b{color:var(--hero-fg);font-family:var(--f-num);font-weight:600}
.linkbtn{border:0;background:none;color:var(--pop);font-weight:700;font-size:12px;padding:2px 0;text-decoration:underline;text-underline-offset:3px}
.budget-edit{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.budget-edit input{flex:1 1 120px;min-width:0;border:1.5px solid var(--hero-track);background:transparent;color:var(--hero-fg);border-radius:10px;padding:8px 10px;font-family:var(--f-num);font-size:16px}
.btn-s{border:0;border-radius:10px;padding:8px 14px;font-weight:900;font-size:13px;background:var(--hero-track);color:var(--hero-fg)}
.btn-s.pri{background:var(--pop);color:var(--pop-ink)}

/* ---------- entry ---------- */
.entry{background:var(--surface);border-radius:22px;padding:14px;display:flex;flex-direction:column;gap:11px;box-shadow:0 1px 0 var(--line),0 10px 30px -18px rgba(20,21,31,.35)}
.amt{display:flex;align-items:center;gap:6px;background:var(--sunk);border-radius:14px;padding:6px 14px;transition:transform .2s}
.amt span{font-family:var(--f-disp);font-size:22px;font-weight:700;color:var(--muted)}
.amt input{flex:1 1 0;width:0;min-width:0;border:0;background:transparent;font-family:var(--f-disp);font-size:30px;font-weight:700;padding:4px 0;outline:none;letter-spacing:-.02em}
.amt input::placeholder{color:var(--muted);opacity:.45;font-family:var(--f-body);font-size:20px;font-weight:700;letter-spacing:0}
.amt:focus-within{box-shadow:inset 0 0 0 2px var(--ink)}
.amt.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.cats{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-inline:-14px;padding:2px 14px}
.cats::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;border:0;background:var(--sunk);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:700;white-space:nowrap;transition:transform .15s,background .2s,color .2s}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--dot)}
.chip[aria-pressed="true"]{background:var(--dot);color:#fff;transform:scale(1.04)}
.chip[aria-pressed="true"] i{background:#fff}
.chip:active{transform:scale(.94)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--sunk);border-radius:12px;padding:3px;position:relative}
.seg::before{content:"";position:absolute;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);border-radius:9px;background:var(--surface);box-shadow:0 1px 4px rgba(20,21,31,.15);transition:transform .3s cubic-bezier(.3,1.4,.5,1),background .25s}
.seg[data-v="want"]::before{transform:translateX(100%);background:var(--bad)}
.seg button{position:relative;z-index:1;border:0;background:none;padding:8px 6px;font-size:13px;font-weight:900;color:var(--muted);transition:color .25s}
.seg button[aria-pressed="true"]{color:var(--ink)}
.seg[data-v="want"] button[aria-pressed="true"]{color:#fff}
.memo{width:100%;min-width:0;border:0;background:var(--sunk);border-radius:12px;padding:10px 14px;font-weight:500;font-size:16px}
.memo:focus{outline:none;box-shadow:inset 0 0 0 2px var(--ink)}
.actions{display:flex;gap:8px}
.cam{flex:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;border:2px solid var(--ink);border-radius:14px;padding:0 14px;font-weight:900;min-height:52px;cursor:pointer;transition:transform .15s}
.cam:active{transform:scale(.95)}
.cam svg{width:20px;height:20px}
.save{flex:1 1 0;min-width:0;border:0;border-radius:14px;background:var(--pop);color:var(--pop-ink);font-family:var(--f-body);font-weight:900;font-size:17px;min-height:52px;letter-spacing:.08em;box-shadow:0 4px 0 #D9A900;transition:transform .12s,box-shadow .12s,opacity .2s}
.save:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 #D9A900}
.save:disabled{opacity:.35;cursor:not-allowed;box-shadow:none}
.status{font-size:13px;font-weight:700;color:var(--muted);min-height:1.3em;margin-top:-3px}
.status.err{color:var(--bad)}
.status.ok{color:var(--ok)}

/* ---------- history ---------- */
.hist{display:flex;flex-direction:column}
.hist-h{display:flex;justify-content:space-between;align-items:baseline;padding:10px 2px 4px}
.hist-h h2{font-family:var(--f-disp);font-size:15px;font-weight:700;margin:0;letter-spacing:.02em}
.hist-h span{font-size:12px;color:var(--muted);font-family:var(--f-num)}
.dayhead{font-size:12px;color:var(--muted);font-weight:700;padding:14px 2px 4px;display:flex;justify-content:space-between}
.dayhead span:last-child{font-family:var(--f-num)}
.day{background:var(--surface);border-radius:16px;padding:2px 14px}
.item{display:grid;grid-template-columns:30px minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .dot{width:30px;height:30px;border-radius:10px;background:color-mix(in srgb,var(--dot) 18%,transparent);display:grid;place-items:center}
.item .dot i{width:10px;height:10px;border-radius:50%;background:var(--dot)}
.item .w div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.item .w small{color:var(--muted);font-size:12px}
.tag{font-size:10px;font-weight:900;color:#fff;background:var(--bad);border-radius:5px;padding:1px 5px;margin-left:6px;vertical-align:1px}
.item .y{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-weight:600}
.item.new{animation:slidein .6s cubic-bezier(.3,1.4,.5,1)}
@keyframes slidein{0%{opacity:0;transform:translateY(-10px) scale(.96);background:color-mix(in srgb,var(--pop) 40%,transparent)}100%{opacity:1;transform:none}}
.del{border:0;background:none;color:var(--muted);padding:4px 6px;border-radius:6px;font-size:12px;font-weight:700}
.del:hover{color:var(--bad);background:var(--sunk)}
.del.confirm{color:#fff;background:var(--bad)}
.empty{color:var(--muted);font-size:14px;padding:20px;border:2px dashed var(--line);border-radius:16px;text-align:center;margin-top:6px}

/* ---------- celebration ---------- */
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 18px);transform:translate(-50%,-140%);z-index:60;background:var(--pop);color:var(--pop-ink);font-weight:900;font-size:15px;padding:10px 18px;border-radius:999px;box-shadow:0 10px 30px -8px rgba(0,0,0,.4);white-space:nowrap;visibility:hidden;transition:transform .45s cubic-bezier(.3,1.6,.5,1),visibility 0s .45s}
.toast.want{background:var(--bad);color:#fff}
.toast.show{transform:translate(-50%,0);visibility:visible;transition:transform .45s cubic-bezier(.3,1.6,.5,1)}
.fly{position:fixed;z-index:55;pointer-events:none;font-family:var(--f-disp);font-weight:800;font-size:22px;color:var(--ink);background:var(--pop);padding:4px 12px;border-radius:12px;white-space:nowrap}
@media (prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <section class="hero" id="hero" data-level="0">
    <div class="hero-top">
      <span class="label" id="mlabel">今月の支出</span>
      <span class="chip-state" id="state">いいペース</span>
    </div>
    <div class="spent" id="spent"><small>¥</small><b id="spentNum">0</b></div>
    <div class="msg" id="msg"></div>
    <div class="bars" aria-hidden="true">
      <span class="k">予算</span>
      <div class="track"><div class="fill" id="fill"></div><div class="tick" id="tick"><span id="tickLabel"></span></div></div>
      <span class="k">日数</span>
      <div class="track thin"><div class="fill day" id="dayFill"></div></div>
    </div>
    <div class="foot">
      <span id="foot"></span>
      <button type="button" class="linkbtn" id="budgetBtn">予算を設定</button>
    </div>
    <div class="budget-edit" id="budgetEdit" hidden>
      <input id="budgetIn" inputmode="numeric" aria-label="今月の予算(円)" placeholder="80000">
      <button type="button" class="btn-s pri" id="budgetSave">保存</button>
      <button type="button" class="btn-s" id="budgetCancel">やめる</button>
    </div>
  </section>

  <form class="entry" id="form" autocomplete="off">
    <div class="amt" id="amtBox"><span>¥</span><input id="amount" inputmode="numeric" placeholder="いくら使った？" aria-label="金額" autofocus></div>
    <div class="cats" id="cats" role="group" aria-label="カテゴリ"></div>
    <div class="seg" id="seg" data-v="need" role="group" aria-label="必要度">
      <button type="button" data-v="need" aria-pressed="true">必要だった</button>
      <button type="button" data-v="want" aria-pressed="false">欲しかっただけ</button>
    </div>
    <input class="memo" id="memo" placeholder="メモ(任意)" maxlength="40" aria-label="メモ">
    <div class="actions">
      <label class="cam" id="camBtn" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
        レシート
        <input type="file" id="photo" accept="image/*" capture="environment" hidden>
      </label>
      <button class="save" id="save" type="submit" disabled>記録する</button>
    </div>
    <div class="status" id="status" role="status"></div>
  </form>

  <section class="hist">
    <div class="hist-h"><h2>履歴</h2><span id="count"></span></div>
    <div id="list"></div>
  </section>
</div>
<canvas id="fx"></canvas>
<div class="toast" id="toast" role="status"></div>

<script>
const CATS=[
  {id:"food",name:"食費",c:"--c1"},{id:"cafe",name:"カフェ・外食",c:"--c2"},{id:"daily",name:"日用品",c:"--c3"},
  {id:"fashion",name:"服・美容",c:"--c5"},{id:"fun",name:"娯楽・趣味",c:"--c4"},{id:"social",name:"交際費",c:"--c8"},
  {id:"move",name:"交通",c:"--c6"},{id:"sub",name:"サブスク",c:"--c7"},{id:"other",name:"その他",c:"--c9"}];
const catOf=id=>CATS.find(c=>c.id===id)||CATS[CATS.length-1];
const $=id=>document.getElementById(id);
const yen=n=>"¥"+Math.round(n).toLocaleString("ja-JP");
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const esc=s=>String(s??"").replace(/[&<>"]/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]));
const reduced=matchMedia("(prefers-reduced-motion: reduce)").matches;

let items=[],budget=80000,sel={cat:"food",want:false},store=null,receiptDate=null,shownTotal=0,newId=null,celebrate=false;

/* ---------- entry ---------- */
$("cats").innerHTML=CATS.map(c=>`<button type="button" class="chip" data-id="${c.id}" style="--dot:var(${c.c})" aria-pressed="${c.id===sel.cat}"><i></i>${c.name}</button>`).join("");
$("cats").addEventListener("click",e=>{const b=e.target.closest(".chip");if(b)setCat(b.dataset.id)});
function setCat(id){sel.cat=id;document.querySelectorAll(".chip").forEach(b=>b.setAttribute("aria-pressed",b.dataset.id===id))}
$("seg").addEventListener("click",e=>{const b=e.target.closest("button");if(b)setWant(b.dataset.v==="want")});
function setWant(v){sel.want=v;$("seg").dataset.v=v?"want":"need";$("seg").querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",(b.dataset.v==="want")===v))}
const amountIn=$("amount");
amountIn.addEventListener("input",()=>{
  const digits=amountIn.value.replace(/[^0-9]/g,"").replace(/^0+/,"").slice(0,9);
  amountIn.value=digits?Number(digits).toLocaleString("ja-JP"):"";
  $("save").disabled=!digits;
});
const amountVal=()=>Number(amountIn.value.replace(/[^0-9]/g,""))||0;
function status(msg,cls=""){const s=$("status");s.textContent=msg;s.className="status "+cls}

$("form").addEventListener("submit",async e=>{
  e.preventDefault();
  const amount=amountVal();
  if(!amount){$("amtBox").classList.remove("shake");void $("amtBox").offsetWidth;$("amtBox").classList.add("shake");return}
  if(!store){status("準備中です。少し待ってからもう一度押してください。","err");return}
  const rec={kind:"e",amount,cat:sel.cat,memo:$("memo").value.trim(),date:receiptDate||ymd(new Date()),want:sel.want,createdAt:Date.now()};
  $("save").disabled=true;
  const from=$("amtBox").getBoundingClientRect(),btn=$("save").getBoundingClientRect();
  try{
    celebrate=true;
    const ref=await store.add(rec);
    newId=ref&&ref.id||rec.id;
    party(rec,from,btn);
    status("");
    amountIn.value="";$("memo").value="";setWant(false);receiptDate=null;
    amountIn.focus({preventScroll:true});
  }catch(err){celebrate=false;status("保存できませんでした。通信状態を確認してもう一度お試しください。","err");$("save").disabled=false}
});

/* ---------- celebration ---------- */
const PRAISE=["記録えらい！","ナイス記録！","把握できてる人の動き","今日も見える化完了","その一手がサイフを守る"];
const HONEST=["正直に記録えらい","自覚できたら勝ち","次はガマンできるかも"];
function toast(text,want){const t=$("toast");t.textContent=text;t.classList.toggle("want",!!want);t.classList.remove("show");void t.offsetWidth;t.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("show"),1600)}
function party(rec,from,btn){
  const list=rec.want?HONEST:PRAISE;
  toast(list[Math.floor(Math.random()*list.length)]+"  "+yen(rec.amount),rec.want);
  if(reduced)return;
  // "+¥430" chip flies from the amount field into the big number
  const target=$("spentNum").getBoundingClientRect();
  const f=document.createElement("div");f.className="fly";f.textContent="+"+yen(rec.amount);
  if(rec.want){f.style.background="var(--bad)";f.style.color="#fff"}
  f.style.left=(from.left+16)+"px";f.style.top=(from.top+6)+"px";document.body.appendChild(f);
  const dx=target.left+target.width/2-(from.left+16)-f.offsetWidth/2,dy=target.top-(from.top+6);
  f.animate([{transform:"translate(0,0) scale(1)",opacity:1},{transform:`translate(${dx*.5}px,${dy*.5-40}px) scale(1.25)`,opacity:1,offset:.5},{transform:`translate(${dx}px,${dy}px) scale(.4)`,opacity:0}],{duration:720,easing:"cubic-bezier(.5,0,.4,1)"}).onfinish=()=>f.remove();
  burst(btn.left+btn.width/2,btn.top+btn.height/2,rec.want);
}
const cv=$("fx"),cx=cv.getContext("2d");let parts=[],raf=0;
function burst(x,y,want){
  const dpr=devicePixelRatio||1;cv.width=innerWidth*dpr;cv.height=innerHeight*dpr;cx.setTransform(dpr,0,0,dpr,0,0);
  const cs=getComputedStyle(document.documentElement);
  const pal=want?["--bad","--warn","--c5"]:["--pop","--ok","--c1","--c5","--c2","--c4"];
  const cols=pal.map(v=>cs.getPropertyValue(v).trim());
  for(let i=0;i<(want?26:60);i++){
    const a=-Math.PI/2+(Math.random()-.5)*Math.PI*1.3,s=6+Math.random()*9;
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,r:4+Math.random()*5,rot:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[i%cols.length],shape:i%5===0?"coin":(i%2?"rect":"circle"),life:1});
  }
  if(!raf)raf=requestAnimationFrame(tick);
}
function tick(){
  cx.clearRect(0,0,innerWidth,innerHeight);
  parts=parts.filter(p=>p.life>0);
  for(const p of parts){
    p.vy+=.35;p.vx*=.985;p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;p.life-=.012;
    cx.save();cx.globalAlpha=Math.max(0,Math.min(1,p.life*1.6));cx.translate(p.x,p.y);cx.rotate(p.rot);cx.fillStyle=p.c;
    if(p.shape==="rect")cx.fillRect(-p.r,-p.r/2,p.r*2,p.r);
    else if(p.shape==="coin"){cx.beginPath();cx.ellipse(0,0,p.r*1.5,p.r*1.5*Math.abs(Math.cos(p.rot*2))+1,0,0,7);cx.fill();}
    else{cx.beginPath();cx.arc(0,0,p.r*.8,0,7);cx.fill()}
    cx.restore();
  }
  raf=parts.length?requestAnimationFrame(tick):0;
  if(!raf)cx.clearRect(0,0,innerWidth,innerHeight);
}
function countTo(n){
  const el=$("spentNum"),start=shownTotal,t0=performance.now(),dur=reduced?0:750;
  shownTotal=n;
  if(!dur||start===n){el.textContent=Math.round(n).toLocaleString("ja-JP");return}
  const sp=$("spent");sp.classList.remove("bump");void sp.offsetWidth;sp.classList.add("bump");
  (function step(t){const k=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-k,3);el.textContent=Math.round(start+(n-start)*e).toLocaleString("ja-JP");if(k<1)requestAnimationFrame(step)})(t0);
}

/* ---------- receipt ---------- */
let receiptOn=false;
$("photo").addEventListener("change",async e=>{
  const f=e.target.files&&e.target.files[0];e.target.value="";
  if(!f)return;
  status("レシートを読み取り中…");
  try{
    const dataUrl=await shrink(f),today=ymd(new Date());
    const r=await call("apiReadReceipt",dataUrl.split(",")[1],"image/jpeg",today);
    if(!r||!r.amount){status("合計金額が読み取れませんでした。手入力してください。","err");amountIn.focus();return}
    amountIn.value=Number(r.amount).toLocaleString("ja-JP");$("save").disabled=false;
    if(r.category&&CATS.some(c=>c.id===r.category))setCat(r.category);
    if(r.store)$("memo").value=String(r.store).slice(0,40);
    receiptDate=(r.date&&/^\d{4}-\d{2}-\d{2}$/.test(r.date)&&r.date<=today)?r.date:null;
    const d=receiptDate&&receiptDate!==today?`(${Number(receiptDate.slice(5,7))}/${Number(receiptDate.slice(8))}の支出として)`:"";
    status(`読み取りました${d}。必要だったか選んで「記録する」を押してください。`,"ok");
  }catch(err){status((err&&err.message)||"読み取りに失敗しました。手入力してください。","err")}
});
function shrink(file){return new Promise((res,rej)=>{
  const img=new Image(),url=URL.createObjectURL(file);
  img.onload=()=>{const s=Math.min(1,1600/Math.max(img.width,img.height));
    const c=document.createElement("canvas");c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);
    res(c.toDataURL("image/jpeg",.85))};
  img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error("画像を開けませんでした"))};img.src=url})}

/* ---------- budget ---------- */
$("budgetBtn").onclick=()=>{$("budgetEdit").hidden=false;$("budgetIn").value=budget;$("budgetIn").focus()};
$("budgetCancel").onclick=()=>{$("budgetEdit").hidden=true};
$("budgetSave").onclick=async()=>{
  const v=Number(String($("budgetIn").value).replace(/[^0-9]/g,""));
  if(!v){$("budgetIn").focus();return}
  budget=v;$("budgetEdit").hidden=true;render();
  try{await store.setBudget(v)}catch(e){status("予算を保存できませんでした","err")}
};

/* ---------- pace ---------- */
// level 0 good · 1 slightly fast · 2 fast · 3 way too fast early in the month · 4 over budget
function paceOf(total,day,dim){
  const used=total/budget,elapsed=day/dim,ratio=elapsed?used/elapsed:0;
  if(used>=1)return{level:4,chip:"予算オーバー",color:"--bad",msg:`予算を <em>${yen(total-budget)}</em> 超えています`};
  if(total===0)return{level:0,chip:"まだ0円",color:"--ok",msg:"今月はまだ使っていません"};
  if(ratio>=1.6&&elapsed<.5)return{level:3,chip:"ヤバい",color:"--bad",msg:`まだ月の <em>${Math.round(elapsed*100)}%</em> なのに予算の <em>${Math.round(used*100)}%</em> 使用`};
  if(ratio>=1.25)return{level:2,chip:"使いすぎ",color:"--warn",msg:`月の経過より <em>${Math.round((ratio-1)*100)}%</em> 速いペース`};
  if(ratio>=1.05)return{level:1,chip:"ちょい速め",color:"--warn",msg:"少しだけペースが速め。ここで調整"};
  return{level:0,chip:"いいペース",color:"--ok",msg:`月の経過より <em>ゆっくり</em> 使えています`};
}

/* ---------- render ---------- */
function render(){
  const now=new Date(),key=now.getFullYear()+"-"+pad(now.getMonth()+1),todayStr=ymd(now);
  const dim=new Date(now.getFullYear(),now.getMonth()+1,0).getDate(),day=now.getDate();
  const mon=items.filter(i=>i.date&&i.date.startsWith(key));
  const total=mon.reduce((s,i)=>s+i.amount,0);
  const p=paceOf(total,day,dim);

  $("mlabel").textContent=`${now.getMonth()+1}月の支出`;
  countTo(total);
  const hero=$("hero");hero.dataset.level=p.level;hero.style.setProperty("--state",`var(${p.color})`);
  $("state").textContent=p.chip;$("msg").innerHTML=p.msg;

  const scale=Math.max(budget,total),tickPos=budget/scale*100;
  $("fill").style.width=(total/scale*100)+"%";
  $("tick").style.left=tickPos+"%";$("tick").classList.toggle("left",tickPos<25);
  $("tickLabel").textContent=yen(budget);
  $("dayFill").style.width=(day/dim*tickPos)+"%";
  const left=dim-day+1,remain=budget-total;
  $("foot").innerHTML=remain>0?`残り <b>${yen(remain)}</b> ・ ${left}日間で1日 <b>${yen(remain/left)}</b>`:`${dim}日中 <b>${day}</b>日目`;

  const sorted=[...mon].sort((a,b)=>b.date.localeCompare(a.date)||b.createdAt-a.createdAt);
  const wants=mon.filter(i=>i.want).reduce((s,i)=>s+i.amount,0);
  $("count").textContent=sorted.length?`${sorted.length}件${wants?" ・ 欲しかっただけ "+yen(wants):""}`:"";
  if(!sorted.length){$("list").innerHTML=`<div class="empty">今月の記録はまだありません。<br>金額を入れて「記録する」を押すと、ここに並びます。</div>`;return}
  const wd="日月火水木金土";let html="",i=0;
  while(i<sorted.length){
    const cur=sorted[i].date,group=[];while(i<sorted.length&&sorted[i].date===cur)group.push(sorted[i++]);
    const d=new Date(cur+"T00:00"),sum=group.reduce((s,x)=>s+x.amount,0);
    html+=`<div class="dayhead"><span>${d.getMonth()+1}/${d.getDate()} (${wd[d.getDay()]})${cur===todayStr?" 今日":""}</span><span>${yen(sum)}</span></div><div class="day">`;
    for(const it of group){const c=catOf(it.cat);
      html+=`<div class="item${it.id===newId?" new":""}" style="--dot:var(${c.c})"><span class="dot"><i></i></span><div class="w"><div>${esc(it.memo||c.name)}${it.want?'<span class="tag">欲しかった</span>':""}</div>${it.memo?`<small>${c.name}</small>`:""}</div><div class="y">${yen(it.amount)}</div><button class="del" data-id="${esc(it.id)}" aria-label="削除">削除</button></div>`}
    html+="</div>";
  }
  $("list").innerHTML=html;newId=null;
}
$("list").addEventListener("click",async e=>{
  const b=e.target.closest(".del");if(!b)return;
  if(!b.classList.contains("confirm")){document.querySelectorAll(".del.confirm").forEach(x=>{x.classList.remove("confirm");x.textContent="削除"});b.classList.add("confirm");b.textContent="本当に削除";return}
  try{await store.remove(b.dataset.id)}catch(err){status("削除できませんでした","err")}
});

/* ---------- storage (Google Apps Script) ---------- */
// 記録先(Apps Script ウェブアプリのURL、/exec まで)
const API="https://script.google.com/macros/s/AKfycbx1MsVpcmQdXEa--Pd07HwtpItNpQNcVwCaKjNZwBdXGToXYljO1T2RqCa3grynIY39kg/exec";
// 合言葉はURLの ?k=… から取り、次回以降のために端末に覚えておく
const TOKEN=(()=>{
  const q=new URLSearchParams(location.search).get("k");
  try{if(q)localStorage.setItem("saifu-k",q);return q||localStorage.getItem("saifu-k")||""}catch(e){return q||""}
})();
// text/plain で送ると、ブラウザの事前確認(CORS)なしで Apps Script に届く
async function call(fn,...args){
  const r=await fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({fn,k:TOKEN,args})});
  const j=await r.json();
  if(!j.ok)throw new Error(j.error||"通信エラー");
  return j.result;
}
const monthKey=()=>{const d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)};
let loadedMonth=null;
async function load(){
  const key=monthKey();
  try{
    const r=await call("apiLoad",key);
    items=r.items;budget=r.budget;loadedMonth=key;render();
  }catch(err){status("読み込めませんでした。電波を確認してページを開き直してください。","err")}
}
store={
  // 画面には先に反映して演出を出し、保存はうしろで行う
  async add(r){
    const tmp="tmp"+Date.now();r.id=tmp;items.push(r);newId=tmp;render();
    call("apiAdd",r).then(res=>{r.id=res.id}).catch(err=>{
      items=items.filter(i=>i!==r);render();
      status("保存できませんでした。もう一度記録してください。","err");
    });
    return{id:tmp};
  },
  async remove(id){
    if(String(id).startsWith("tmp")){status("保存中です。少し待ってから削除してください。","err");return}
    const prev=items;items=items.filter(i=>i.id!==id);render();
    try{await call("apiDelete",id)}catch(err){items=prev;render();throw err}
  },
  async setBudget(v){await call("apiSetBudget",v)}
};
// 月が変わったり、アプリに戻ってきたら最新を読み直す
document.addEventListener("visibilitychange",()=>{if(!document.hidden)load()});
setInterval(()=>{if(monthKey()!==loadedMonth)load()},60000);
render();
if(TOKEN)load();else status("URLの末尾に ?k=合言葉 を付けて開いてください。","err");
call("apiReceiptEnabled").then(on=>{receiptOn=on;$("camBtn").hidden=!on}).catch(()=>{});
</script>
